<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무니즈 캐릭터 소개 페이지</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/universe.css">
    <link rel="stylesheet" href="css/characters.css">
    <script src="js/common.js" defer></script>
    <script src="js/universe.js" defer></script>
</head>

<body>
    <div id="wrap" class="horizontal-scroll">
        <section class="characterBg">
            <header id="header" class="header">
                <div class="characters-inner">
                    <button type="button" id="gnbBtn" class="gnb-btn">
                        <img src="img/icon/ico_menu.png" alt="메뉴 열기">
                    </button>
                    <h1 id="logo-b">
                        <a href="index.html"></a>
                    </h1>
                    <div class="ico-shop">
                        <a href="goods-store.html"><img src="img/icon/ico_shop.png" alt="goodsstore"></a>
                    </div>
                </div>
                <nav class="gnb">
                    <button type="button" id="closeBtn" class="close-btn"><img src="img/icon/ico_X.png"
                            alt="메뉴 닫기"></button>
                    <ul>
                        <li>
                            <a href="index.html">
                                <img src="img/gnb/gnb-text/home.png" alt="홈">
                            </a>
                        </li>
                        <li>
                            <a href="sub-universe.html">
                                <img src="img/gnb/gnb-text/universe.png" alt="세계관">
                            </a>
                        </li>
                        <li>
                            <a href="sub-characters.html">
                                <img src="img/gnb/gnb-text/characters.png" alt="캐릭터">
                            </a>
                        </li>
                        <li>
                            <a href="sub-contents.html">
                                <img src="img/gnb/gnb-text/contents.png" alt="콘텐츠">
                            </a>
                        </li>
                        <li>
                            <a href="sub-projects.html">
                                <img src="img/gnb/gnb-text/projects.png" alt="프로젝트">
                            </a>
                        </li>
                        <li>
                            <a href="sub-popup.html">
                                <img src="img/gnb/gnb-text/popup.png" alt="팝업">
                            </a>
                        </li>
                        <li>
                            <a href="sub-contact.html">
                                <img src="img/gnb/gnb-text/contact.png" alt="고객센터">
                            </a>
                        </li>
                    </ul>
                </nav>
            </header>

            <div class="profile-wrap">
                <ul class="profile-list">
                    <li>
                        <a class="profile-frame gomi">
                            <div class="characters-area gomi">
                                <div class="character">
                                    <img src="img/MOONYZ/고미.png" alt="고미">
                                </div>
                            </div>
                            <p class="characters-name gomi">고미</p>
                        </a>
                    </li>
                    <li>
                        <a class="profile-frame">
                            <div class="characters-area c2">
                                <div class="character">
                                    <img src="img/MOONYZ/찡이.png" alt="찡이">
                                </div>
                            </div>
                            <p class="characters-name">찡이</p>
                        </a>
                    </li>


                </ul>
            </div>
        </section>
    </div>
</body>

</html>
